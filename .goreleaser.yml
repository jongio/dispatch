version: 2

builds:
  - main: ./cmd/dispatch
    binary: dispatch
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X github.com/jongio/dispatch/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "dispatch_checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  # Store the complete Sigstore bundle in GoReleaser's tracked signature
  # artifact so the certificate is published with every release.
  - cmd: cosign
    artifacts: checksum
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^style:"
      - "^ci:"
      - "^test:"

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1
  draft: false
  prerelease: auto
  header: |
    ## Install

    **Linux / macOS:**
    ```bash
    curl -fsSL https://github.com/jongio/dispatch/releases/download/{{ .Tag }}/install.sh | sh
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://github.com/jongio/dispatch/releases/download/{{ .Tag }}/install.ps1 | iex
    ```

    **Install this specific version:**
    ```bash
    # Linux / macOS
    curl -fsSL https://github.com/jongio/dispatch/releases/download/{{ .Tag }}/install.sh | sh -s -- {{ .Tag }}

    # Windows (PowerShell)
    $v="{{ .Tag }}"; irm https://github.com/jongio/dispatch/releases/download/{{ .Tag }}/install.ps1 | iex
    ```
  footer: |
    ---

    **Full Changelog**: https://github.com/jongio/dispatch/compare/{{ .PreviousTag }}...{{ .Tag }}
